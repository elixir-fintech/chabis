name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.13.4"
            otp: "25.3"
          - elixir: "1.14.5"
            otp: "26.2"
          - elixir: "1.15.8"
            otp: "26.2"
          - elixir: "1.16.3"
            otp: "26.2"
          - elixir: "1.17.3"
            otp: "27.3"
          - elixir: "1.18.4"
            otp: "28.0"
          - elixir: "1.19.5"
            otp: "28.0"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.0"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-quality-1.18.4-28.0-${{ hashFiles('mix.lock') }}
          restore-keys: mix-quality-1.18.4-28.0-

      - run: mix deps.get
      - run: mix format --check-formatted
